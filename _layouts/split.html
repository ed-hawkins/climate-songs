<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
        }
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        /* Sidebar (Left) */
        .sidebar {
            width: 300px;
            background-color: #f6f8fa;
            padding: 20px;
            box-sizing: border-box;
            border-right: 1px solid #d0d7de;
            overflow-y: auto;
        }
        /* Content Panel (Right) */
        .content {
            flex: 1;
            padding: 40px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            margin-bottom: 8px;
        }
        a {
            color: #0969da;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        /* Highlight the active link */
        a.active {
            font-weight: bold;
            color: #24292f;
        }

/* Style all tables rendered from Markdown */
table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 15px;
    margin-bottom: 15px;
}

/* Add custom padding to table headers and cells */
table th, table td {
    padding: 12px 16px; /* First number is top/bottom, second is left/right */
    border: 1px solid #d0d7de;
    text-align: left;
}

/* Optional: Add a background color to the header */
table th {
    background-color: #f6f8fa;
    font-weight: 600;
}

/* Optional: Add zebra striping to rows */
table tr:nth-child(even) {
    background-color: #f8f9fa;
}


    </style>
</head>
<body>

    <div class="container">
        <!-- Left Side: Dynamic Sidebar Links -->
        <div class="sidebar">
            <h3>Climate Songs</h3>
            {% assign sorted_pages = site.pages | sort: "path" %}

            <ul>
                <li>
                    <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
                </li>
                
                <!-- Jekyll loops through all pages and filters for files in the 'songs' folder -->
                {% for p in sorted_pages %}
                    {% if p.path contains 'songs/' %}
                        <li>
                            <a href="{{ p.url | relative_url }}" {% if page.url == p.url %}class="active"{% endif %}>
                                {{ p.title | default: p.name }}
                            </a>
                        </li>
                    {% endif %}
                {% endfor %}
            </ul>
        </div>

        <!-- Right Side: Rendered Markdown Content -->
        <div class="content">
            {{ content }}
        </div>
    </div>

</body>
</html>
