<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
        }
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        /* Sidebar (Left) */
        .sidebar {
            width: 300px;
            background-color: #f6f8fa;
            padding: 20px;
            box-sizing: border-box;
            border-right: 1px solid #d0d7de;
            overflow-y: auto;
        }
        /* Content Panel (Right) */
        .content {
            flex: 1;
            padding: 40px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            margin-bottom: 8px;
        }
        a {
            color: #0969da;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        /* Highlight the active link */
        a.active {
            font-weight: bold;
            color: #24292f;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Left Side: Dynamic Sidebar Links -->
        <div class="sidebar">
            <h3>Documents</h3>
            <ul>
                <li>
                    <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
                </li>
                
                <!-- Jekyll loops through all pages and filters for files in the 'docs' folder -->
                {% for p in site.pages %}
                    {% if p.path contains 'docs/' %}
                        <li>
                            <a href="{{ p.url | relative_url }}" {% if page.url == p.url %}class="active"{% endif %}>
                                {{ p.title | default: p.name }}
                            </a>
                        </li>
                    {% endif %}
                {% endfor %}
            </ul>
        </div>

        <!-- Right Side: Rendered Markdown Content -->
        <div class="content">
            {{ content }}
        </div>
    </div>

</body>
</html>
